{% extends "base.html" %}
{% block content %}
<div class="container">
    <h2>Administración de Usuarios</h2>
    <table class="table table-striped mt-3 shadow-sm bg-white">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Usuario</th>
                <th>Correo</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            {% for u in usuarios %}
            <tr>
                <td>{{ u.id }}</td>
                <td>{{ u.username }}</td>
                <td>{{ u.email }}</td>
                <td>
                    <a href="{{ url_for('usuarios.edit', id=u.id) }}" class="btn btn-warning btn-sm">Editar</a>
                    <a href="{{ url_for('usuarios.delete', id=u.id) }}" class="btn btn-danger btn-sm" onclick="return confirm('¿Estás seguro?')">Eliminar</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
